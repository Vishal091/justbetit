name: Validate dynamic site

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Build production site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://just-bet-it.com
